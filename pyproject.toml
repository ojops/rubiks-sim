[project]
name = "rubiks-sim"
version = "0.1.0"
requires-python = "==3.10.*"
description = "Cube models, bounded IDA* search and optional Manim visualisation"
readme = "README.md"
dependencies = ["numpy>=2.2.6,<3"]

[project.optional-dependencies]
render = ["av>=17.1.0", "manimgl"]
demo = [
    "pillow==12.3.0",
]

[project.scripts]
rubiks-sim = "rubiks_sim.main:main"

[tool.uv.sources]
manimgl = { git = "https://github.com/3b1b/manim.git", rev = "fafa083a4fb274bba9cabde0b6e2f50ba6da0622" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "ruff==0.14.3",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rubiks_sim"]

[tool.ruff]
target-version = "py310"
line-length = 88

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
