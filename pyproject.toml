[project]
name = "rubiks-sim"
version = "0.1.0"
requires-python = "==3.10.*"
dependencies = [
    "av>=17.1.0",
    "manimgl",
]

[tool.uv.sources]
manimgl = { git = "https://github.com/3b1b/manim.git", rev = "fafa083a4fb274bba9cabde0b6e2f50ba6da0622" }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/rubiks_sim"]
